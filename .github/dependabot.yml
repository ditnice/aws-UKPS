version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: daily
      time: "07:00"
      timezone: Europe/London
    cooldown:
      default-days: 7
    groups:
      frontend-dependencies:
        patterns:
          - "*"
    ignore:
      # Keep Sass below 1.80 for NICE Design System SCSS deprecation noise.
      - dependency-name: sass
        versions:
          - ">=1.80.0"
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    labels:
      - dependencies
      - frontend

  - package-ecosystem: nuget
    directory: /backend
    schedule:
      interval: daily
      time: "07:00"
      timezone: Europe/London
    groups:
      backend-dependencies:
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    labels:
      - dependencies
      - backend

  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: daily
      time: "07:00"
      timezone: Europe/London
    # One PR per Dockerfile set, so build and runtime images (e.g. Node, .NET) are bumped together.
    groups:
      frontend-docker:
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    labels:
      - dependencies
      - docker
      - frontend

  - package-ecosystem: docker
    directories:
      - /backend
      - /backend/migration
    schedule:
      interval: daily
      time: "07:00"
      timezone: Europe/London
    # One PR per Dockerfile set, so build and runtime images (e.g. Node, .NET) are bumped together.
    groups:
      backend-docker:
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    labels:
      - dependencies
      - docker
      - backend

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: daily
      time: "07:00"
      timezone: Europe/London
    ignore:
      # Keep Postgres on the same minor version as Aurora (aurora_engine_version); digest updates still apply.
      - dependency-name: postgres
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    labels:
      - dependencies
      - docker

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
      time: "07:00"
      timezone: Europe/London
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    labels:
      - dependencies

  - package-ecosystem: terraform
    directories:
      - /infrastructure/environments/dev
      - /infrastructure/environments/prod
      - /infrastructure/environments/staging
      - /infrastructure/environments/test
      - /infrastructure/modules/alb
      - /infrastructure/modules/aurora
      - /infrastructure/modules/cloudwatch/ecs-alerts
      - /infrastructure/modules/cloudwatch/rds-alerts
      - /infrastructure/modules/ecs
      - /infrastructure/modules/kms
      - /infrastructure/modules/networking
      - /infrastructure/modules/s3
      - /infrastructure/modules/sns
    schedule:
      interval: daily
      time: "07:00"
      timezone: Europe/London
    groups:
      terraform-dependencies:
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    labels:
      - dependencies
      - infrastructure
