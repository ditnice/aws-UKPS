name: Playwright E2E

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playwright-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright-e2e:
    name: Playwright E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install just
        run: |
          archive="$RUNNER_TEMP/just-1.45.0-x86_64-unknown-linux-musl.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            --output "$archive" \
            https://github.com/casey/just/releases/download/1.45.0/just-1.45.0-x86_64-unknown-linux-musl.tar.gz
          printf '%s  %s\n' dc3f958aaf8c6506dd90426e9b03f86dd15e74a6467ee0e54929f750af3d9e49 "$archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/just-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/just-bin" just
          echo "$RUNNER_TEMP/just-bin" >> "$GITHUB_PATH"

      - name: Run Playwright suite with Docker Compose
        id: e2e
        timeout-minutes: 55
        env:
          CI: 'true'
          COMPOSE_PROJECT_NAME: ukps-e2e-${{ github.run_id }}-${{ github.run_attempt }}
        run: just e2e

      - name: Verify Playwright reports were produced
        if: ${{ !cancelled() && steps.e2e.outcome == 'success' }}
        run: |
          if [[ ! -s e2e-results/playwright-report/index.html || ! -s e2e-results/junit.xml ]]; then
            echo "::error::Playwright passed but the HTML or JUnit report is missing or empty."
            exit 1
          fi

      - name: Upload Playwright reports and diagnostics
        if: ${{ !cancelled() && hashFiles('e2e-results/playwright-report/index.html', 'e2e-results/junit.xml', 'e2e-results/stack.log') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: e2e-results/
          if-no-files-found: error
          retention-days: 14
