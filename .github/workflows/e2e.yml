name: E2E tests

# Runs the full Playwright suite against the Docker Compose stack (docker-compose.yml).
# The stack uses the dev-auth bypass and a throwaway Postgres, so no secrets are needed.

on:
  push:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
    steps:
      # actions/checkout v7.0.1 (Node 24).
      # Pinned to a commit SHA so a moved tag can't change what runs; newest release at
      # least 7 days old. Pinned 2026-10-20.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # docker/setup-buildx-action v4.4.1 (Node 24).
      # Pinned to a commit SHA so a moved tag can't change what runs; newest release at
      # least 7 days old. Pinned 2026-10-20.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Tags match the image names Compose uses for project "ukps", so `up --no-build` uses them.
      # docker/bake-action v7.4.0 (Node 24); v7.5.0 skipped as under 7 days old.
      # Pinned to a commit SHA so a moved tag can't change what runs; newest release at
      # least 7 days old. Pinned 2026-10-20.
      - name: Build images
        uses: docker/bake-action@018cb6412ab401ebaa809aa5f85966b74628600f # v7.4.0
        with:
          source: .
          files: docker-compose.yml
          targets: backend,frontend,playwright
          load: true
          set: |
            backend.tags=ukps-backend
            frontend.tags=ukps-frontend
            playwright.tags=ukps-playwright
            backend.cache-from=type=gha,scope=e2e-backend
            backend.cache-to=type=gha,mode=max,scope=e2e-backend
            frontend.cache-from=type=gha,scope=e2e-frontend
            frontend.cache-to=type=gha,mode=max,scope=e2e-frontend
            playwright.cache-from=type=gha,scope=e2e-playwright
            playwright.cache-to=type=gha,mode=max,scope=e2e-playwright

      - name: Prepare report directories
        run: |
          mkdir -p e2e-results
          echo "E2E_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "E2E_GID=$(id -g)" >> "$GITHUB_ENV"

      - name: Run Playwright
        run: docker compose --profile e2e up --no-build --exit-code-from playwright

      - name: Collect container logs
        if: failure()
        run: docker compose --profile e2e logs --no-color > compose-logs.txt

      - name: Summarise results
        if: always()
        run: |
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import os
          import xml.etree.ElementTree as ET

          path = "e2e-results/junit.xml"
          if not os.path.exists(path):
              print("### E2E tests\n\nNo JUnit report was produced; see the container logs artifact.")
          else:
              root = ET.parse(path).getroot()
              total = int(root.get("tests", 0))
              failed = int(root.get("failures", 0)) + int(root.get("errors", 0))
              skipped = int(root.get("skipped", 0))
              print("### E2E tests\n")
              print("| Passed | Failed | Skipped |\n|---|---|---|")
              print(f"| {total - failed - skipped} | {failed} | {skipped} |")
          EOF

      # actions/upload-artifact v7.0.2 (Node 24).
      # Pinned to a commit SHA so a moved tag can't change what runs; newest release at
      # least 7 days old. Pinned 2026-10-20.
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report-${{ github.run_id }}
          path: |
            e2e-results/
            compose-logs.txt
          retention-days: 14
          if-no-files-found: ignore

      - name: Stop stack
        if: always()
        run: docker compose --profile e2e down --volumes --remove-orphans
