minimumReleaseAge: 10080 # 7 days

# Force patched versions of transitive deps flagged by `trivy fs` for known
# vulns, until the packages pulling them in (payload, css-tree, monaco-editor,
# drizzle-kit) release versions that bump them on their own.
overrides:
  '@esbuild-kit/core-utils>esbuild': ^0.25.0 # GHSA-67mh-4wv8-2f99, via drizzle-kit (pins ~0.18.20)
  dompurify: ^3.4.16 # CVE-2026-65898, CVE-2026-65899, CVE-2026-66010, GHSA-55q2-fjhq-7xh7, GHSA-6688-9rhm-gjv2, via monaco-editor (pins 3.4.8)
  source-map-js: ^1.2.2 # CVE-2026-93749, via css-tree/postcss
  undici: ^7.29.1 # CVE-2026-19534, CVE-2026-84961, via payload (pins 7.29.0)

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  sharp: true
  unrs-resolver: true

# FilterPanel 5.1.0 hard-codes `filter-panel-body`, producing duplicate IDs when
# multiple panels are rendered.
patchedDependencies:
  '@nice-digital/nds-filters@5.1.0': patches/@nice-digital__nds-filters@5.1.0.patch

# NICE packages have not yet widened their peer ranges beyond React 18.
# These scoped exceptions allow installation; they do not assert runtime compatibility.
peerDependencyRules:
  allowedVersions:
    '@headlessui/react@1.7.19>react': '19'
    '@headlessui/react@1.7.19>react-dom': '19'
